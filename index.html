<!DOCTYPE html>
<html>
<head>
    <title>Digital Resource Archive</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .game-card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; text-decoration: none; color: black; display: block; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .game-card img { width: 100%; border-radius: 4px; }
        h2 { border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Assigned Modules</h2>

    <div class="grid">
        <a href="snow-rider/index.html" class="game-card">
            <img src="https://cdn.jsdelivr.net/gh/USER/REPO@main/assets/snow-rider-thumb.png" alt="Physics 3D">
            <p>3D Friction Simulation</p>
        </a>

        <a href="slope/index.html" class="game-card">
            <img src="https://cdn.jsdelivr.net/gh/USER/REPO@main/assets/slope-thumb.png" alt="Geometry">
            <p>Velocity Control Lab</p>
        </a>
    </div>

</body>
</html>
